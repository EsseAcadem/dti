name: Update Skills England apprenticeships

on:
  workflow_dispatch:
  schedule:
    # Weekly is enough for apprenticeship-standard changes.
    - cron: '17 5 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build current apprenticeship catalogue
        env:
          SKILLS_ENGLAND_API_KEY: ${{ secrets.SKILLS_ENGLAND_API_KEY }}
        run: node .github/scripts/update-apprenticeships.mjs

      - name: Commit catalogue if it changed
        shell: bash
        run: |
          if git diff --quiet -- apprenticeships.json; then
            echo "No apprenticeship changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apprenticeships.json
          git commit -m "Update Skills England apprenticeship catalogue"
          git push
